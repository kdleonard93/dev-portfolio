<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/images/DD_Icon.jpg" />
		<link rel="me" href="https://mastodon.social/@digitaldopamine" />

		<meta
			name="description"
			content="Kyle Leonard, Software Engineer. Projects, writing, and the tools I build with."
		/>
		<meta property="og:title" content="Kyle Leonard, Software Engineer" />
		<meta
			property="og:description"
			content="Kyle Leonard, Software Engineer. Projects, writing, and the tools I build with."
		/>
		<meta property="og:type" content="website" />

		<script>
			try {
				var stored = localStorage.getItem('theme');
				var prefersDark =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (stored === 'dark' || (!stored && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<a rel="me" style="display: none" href="https://mastodon.social/@digitaldopamine">Mastodon</a>
	</body>
</html>
